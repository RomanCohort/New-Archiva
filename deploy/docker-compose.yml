# AIRI 网页版 —— 用 nginx 托管已经构建好的 dist（部署到服务器时用这个）
# 前提：先在 airi 仓库里跑过
#   pnpm -F @proj-airi/stage-web run build
# 启动：docker compose up -d
# 访问：http://<主机>:8080
services:
  airi-web:
    image: nginx:stable-alpine
    container_name: airi-web
    ports:
      - "8080:80"
    volumes:
      - ../airi/apps/stage-web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
