# 配合 docker-compose.yml 使用：托管 AIRI 网页版静态产物
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # wasm / 大字体动辄几十 MB，别让上传体积限制误伤到 PUT/WebSocket 升级类请求
  client_max_body_size 64m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    image/svg+xml
    text/css
    text/plain;

  # 内容带 hash，可以长期缓存
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Service Worker 绝不能缓存旧的
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # SPA 路由回退
  location / {
    try_files $uri $uri/ /index.html;
  }
}
